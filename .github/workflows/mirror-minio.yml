name: Mirror MinIO to GHCR

# 手动触发（Actions 页面点 Run workflow），或推送到本文件时自动触发
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-minio.yml'

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull MinIO from Docker Hub
        run: docker pull minio/minio:latest

      - name: Tag for GHCR
        run: |
          docker tag minio/minio:latest ghcr.io/${{ github.repository_owner }}/minio:latest

      - name: Push to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/minio:latest
